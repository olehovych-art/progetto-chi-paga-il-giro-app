<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/styles/style.css">
</head>

<body>
    <header>
        <h1 id="appTitle" class="h3 fw-bold mb-4 text-warning text-center mt-3">CHI OFFRE IL GIRO?🍻</h1>
    </header>
    <main>

        <!-- CARD ULTIMO GIRO -->
        <div id="ultimoGiro" class="card bg-dark border-secondary text-white mb-4 p-3 shadow text-center">

            <!-- ETICHETTA SUPERIORE -->
            <small id="lastPayerLabel" class="text-uppercase text-secondary fw-bold small">
                L'ultimo giro è stato offerto da:
            </small>

            <!-- NOME DEL PAGANTE -->
            <div class="my-3">
                <span id="lastPayerName" class="display-6 fw-bold text-warning">
                    👑 Nessuno 👑
                </span>
            </div>

            <!-- ORARIO DEL GIRO -->
            <small id="lastPayerTime" class="text-secondary">
                Nessun giro registrato stasera
            </small>

        </div>

        <!-- REGISTRA NUOVO GIRO -->
        <div id="sezioneRegistra" class="card bg-dark border-secondary text-white mb-4 p-3 shadow">

            <h5 id="recordTitle" class="card-title h6 text-uppercase text-secondary mb-3 text-center">
                Registra Giro di Oggi
            </h5>

            <!-- SELEZIONE AMICO -->
            <div class="mb-3">
                <select id="payerSelect" class="form-select form-select-lg bg-secondary text-white border-0">
                    <option value="">Seleziona chi paga...</option>
                </select>
            </div>

            <!-- PULSANTE REGISTRA -->
            <button id="btnRecord" class="btn btn-warning btn-lg fw-bold w-100 py-3 shadow-sm">
                🍻 REGISTRA IL GIRO 🍻
            </button>

        </div>

        <!-- RIEPILOGO GRUPPO -->
        <div id="sezioneRiepilogo" class="card bg-dark border-secondary text-white p-3 shadow text-start">

            <h5 id="summaryTitle" class="card-title h6 text-uppercase text-secondary mb-3 text-center">
                Riepilogo Gruppo
            </h5>

            <!-- LISTA DEGLI AMICI E DEI GIRI -->
            <ul id="statsList" class="list-group list-group-flush">
                <!-- Esempio temporaneo per la grafica (JavaScript poi lo sostituirà) -->
                <li
                    class="list-group-item bg-transparent text-white d-flex justify-content-between align-items-center border-secondary px-0">
                    <span>Marco</span>
                    <span class="badge bg-warning text-dark rounded-pill">🍻 2 giri</span>
                </li>
            </ul>

        </div>


    </main>


    <!-- NAVIGAZIONE IN BASSO (BOTTOM NAV) -->
    <nav class="navbar fixed-bottom bg-dark border-top border-secondary py-2">
        <div class="container d-flex justify-content-around text-center" style="max-width: 480px;">

            <!-- TASTO HOME -->
            <button class="btn text-warning d-flex flex-column align-items-center p-1 border-0" id="navHome">
                <span class="fs-4">🏠</span>
                <small class="fw-bold" style="font-size: 0.75rem;">Home</small>
            </button>

            <!-- TASTO GRUPPI -->
            <button class="btn text-secondary d-flex flex-column align-items-center p-1 border-0" id="navGroups">
                <span class="fs-4">👥</span>
                <small class="fw-bold" style="font-size: 0.75rem;">Gruppi</small>
            </button>

            <!-- TASTO CRONOLOGIA -->
            <button class="btn text-secondary d-flex flex-column align-items-center p-1 border-0" id="navHistory">
                <span class="fs-4">📜</span>
                <small class="fw-bold" style="font-size: 0.75rem;">Cronologia</small>
            </button>

        </div>
    </nav>

    <!-- Spaziatore per evitare che la bottom nav copra l'ultima card -->
    <div style="height: 70px;"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="./assets/script/main.js"></script>
</body>

</html>
